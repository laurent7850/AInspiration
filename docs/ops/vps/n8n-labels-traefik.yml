  n8n:
    image: n8nio/n8n:2.40.5
    restart: always
    depends_on:
      init-speaks:
        condition: service_completed_successfully
    environment:
      DB_SQLITE_POOL_SIZE: 2
      N8N_RUNNER_ENABLED: true
      N8N_RUNNER_ALLOW_ENVIRONMENT_ACCESS: true
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_HOST: n8n.srv767464.hstgr.cloud
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://n8n.srv767464.hstgr.cloud
      N8N_MIGRATE_FS_STORAGE_PATH: "true"   # binaryData -> storage, renomme en v3
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_RUNNERS_TASK_TIMEOUT: 300
      N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES: 2147483648
      N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES: 5000
      N8N_OAUTH_AUTHORIZATION_ALLOW_NO_AUTH: true
      N8N_TRUST_PROXY: true
      N8N_RESTRICT_FILE_ACCESS_TO: "/home/node/.n8n;/opt/speaks"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AUDITYO_BLOG_WEBHOOK_SECRET: ${AUDITYO_BLOG_WEBHOOK_SECRET}
      DA_BLOG_API_KEY: ${DA_BLOG_API_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      GOOGLE_PSI_API_KEY: ${GOOGLE_PSI_API_KEY}
      SEOPILOT_WEBHOOK_SECRET: ${SEOPILOT_WEBHOOK_SECRET}
      LISTENER_HMAC_KEY: ${LISTENER_HMAC_KEY}
      SEOPILOT_API_URL: https://seopilot.srv767464.hstgr.cloud/api/webhooks/n8n
    volumes:
      - /root/n8n_test_data:/home/node/.n8n
      - /opt/speaks:/opt/speaks
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.srv767464.hstgr.cloud`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      # --- C37, 25/09/2026 : limitation de debit des webhooks de chatbot ---
      # Les trois webhooks sont publics par necessite : un secret place dans un
      # widget de navigateur n'en est pas un. La premiere barriere est donc le
      # debit, par IP. Traefik est en frontal direct sur 80/443, sans proxy
      # devant : il voit la vraie adresse du client, le comptage est donc juste.
      # 20 requetes par minute, rafale de 10. Un echange coute deux requetes
      # (preflight CORS + message), donc ~10 messages par minute et par IP :
      # large pour un humain, etroit pour une boucle.
      - "traefik.http.middlewares.chatbot-ratelimit.ratelimit.average=20"
      - "traefik.http.middlewares.chatbot-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.chatbot-ratelimit.ratelimit.burst=10"
      - "traefik.http.routers.n8n-chat.rule=Host(`n8n.srv767464.hstgr.cloud`) && (Path(`/webhook/ainspiration`) || Path(`/webhook/chatbot`) || Path(`/webhook/audityo-chat`))"
      - "traefik.http.routers.n8n-chat.entrypoints=websecure"
      - "traefik.http.routers.n8n-chat.tls.certresolver=letsencrypt"
      - "traefik.http.routers.n8n-chat.priority=100"
      - "traefik.http.routers.n8n-chat.middlewares=chatbot-ratelimit@docker"

  traefik:
